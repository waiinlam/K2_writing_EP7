<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雨傘：直鈎 - K2 筆順學習遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f7f9fc;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 15px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #reward-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #reward-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .reward-card {
            background: #fff;
            padding: 30px 50px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .reward-card h1 {
            color: #ff6b81;
            font-size: 40px;
            margin: 0 0 20px 0;
        }
        #restart-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            background: #ff4757;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 20;
            display: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-board">⭐ <span id="star-count">0</span> / 5</div>
    <canvas id="gameCanvas"></canvas>
    <button id="restart-btn">再玩一次</button>
    
    <div id="reward-overlay">
        <div class="reward-card">
            <h1>✨ 你真努力！</h1>
            <p id="reward-sub" style="font-size: 20px; color: #555; margin: 0;">太棒了，完成一個直鈎囉！</p>
        </div>
    </div>
</div>

<script>
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    var starCountEl = document.getElementById('star-count');
    var rewardOverlay = document.getElementById('reward-overlay');
    var restartBtn = document.getElementById('restart-btn');

    var scale = 1, offsetX = 0, offsetY = 0;
    var logicalWidth = 1414, logicalHeight = 2000;
    var completedStars = 0;
    var isGameOver = false;

    // --- 新版座標設定 (傘邊下起點、縮短 5% 直線) ---
    var startPoint = { x: 707, y: 1100 };       // 起點 (移至傘邊下方)
    var turnPoint = { x: 707, y: 1510 };        // 轉角位 (直線長度縮短)
    var hookControlPoint = { x: 707, y: 1560 }; // 彎位控制點
    var endPoint = { x: 550, y: 1450 };         // 終點 

    // --- 防出界系統設定 ---
    var pathWidth = 80;            // 200% 加寬的引導路線
    var touchRadius = 100;         // 起點/終點的感應範圍 (加大方便點擊)
    var allowedDeviation = 90;     // 允許手指偏離路線的最大距離，超過此數字即視為「出界重來」
    
    var isDragging = false;
    var userPath = [];
    var guidePoints = []; // 預先計算好的軌跡中心點，用作偵測是否出界

    // 載入圖片
    var bgImg = new Image();
    var bgLoaded = false;
    bgImg.onload = function() { bgLoaded = true; };
    bgImg.src = '20.png';

    var umbrellaImg = new Image();
    var umbrellaLoaded = false;
    umbrellaImg.onload = function() { umbrellaLoaded = true; };
    umbrellaImg.src = '21.png';

    // 預先產生「防出界」的軌跡偵測點
    function generateGuidePoints() {
        guidePoints = [];
        // 1. 直線部分
        for (var i = 0; i <= 1; i += 0.05) {
            guidePoints.push({
                x: startPoint.x + (turnPoint.x - startPoint.x) * i,
                y: startPoint.y + (turnPoint.y - startPoint.y) * i
            });
        }
        // 2. 轉彎鈎起部分 (二次貝茲曲線公式)
        for (var i = 0; i <= 1; i += 0.05) {
            var u = 1 - i;
            var x = u * u * turnPoint.x + 2 * u * i * hookControlPoint.x + i * i * endPoint.x;
            var y = u * u * turnPoint.y + 2 * u * i * hookControlPoint.y + i * i * endPoint.y;
            guidePoints.push({ x: x, y: y });
        }
    }
    generateGuidePoints(); // 初始化時執行一次

    function resizeCanvas() {
        var container = document.getElementById('game-container');
        var width = container.clientWidth;
        var height = container.clientHeight;
        
        var pixelRatio = window.devicePixelRatio || 1;
        canvas.width = width * pixelRatio;
        canvas.height = height * pixelRatio;
        ctx.scale(pixelRatio, pixelRatio);

        var scaleX = width / logicalWidth;
        var scaleY = height / logicalHeight;
        scale = Math.min(scaleX, scaleY);

        offsetX = (width - logicalWidth * scale) / 2;
        offsetY = (height - logicalHeight * scale) / 2;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function getLogicalPos(e) {
        var rect = canvas.getBoundingClientRect();
        var clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
        var clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left - offsetX) / scale,
            y: (clientY - rect.top - offsetY) / scale
        };
    }

    function getDistance(p1, p2) {
        var dx = p1.x - p2.x;
        var dy = p1.y - p2.y;
        return Math.sqrt(dx * dx + dy * dy);
    }

    // 事件監聽
    canvas.addEventListener('mousedown', handleStart, false);
    canvas.addEventListener('mousemove', handleMove, false);
    canvas.addEventListener('mouseup', handleEnd, false);
    canvas.addEventListener('mouseleave', handleEnd, false);

    canvas.addEventListener('touchstart', function(e) { e.preventDefault(); handleStart(e); }, {passive: false});
    canvas.addEventListener('touchmove', function(e) { e.preventDefault(); handleMove(e); }, {passive: false});
    canvas.addEventListener('touchend', function(e) { e.preventDefault(); handleEnd(e); }, {passive: false});

    function handleStart(e) {
        if (isGameOver) return;
        var pos = getLogicalPos(e);
        if (getDistance(pos, startPoint) <= touchRadius) {
            isDragging = true;
            userPath = [startPoint];
        }
    }

    function handleMove(e) {
        if (!isDragging || isGameOver) return;
        var pos = getLogicalPos(e);
        
        // --- 檢查是否出界 (防偏離系統) ---
        var isOffPath = true;
        for (var i = 0; i < guidePoints.length; i++) {
            if (getDistance(pos, guidePoints[i]) <= allowedDeviation) {
                isOffPath = false; // 只要靠近軌跡上的任何一點，就當作在路線內
                break;
            }
        }

        if (isOffPath) {
            // 如果出界，直接中斷拖曳並清空筆畫 (重回起點)
            isDragging = false;
            userPath = [];
            return;
        }

        // 如果未出界，記錄筆畫
        userPath.push(pos);

        // 檢查是否到達終點
        if (getDistance(pos, endPoint) <= touchRadius) {
            isDragging = false;
            triggerSuccess();
        }
    }

    function handleEnd(e) {
        if (!isDragging) return;
        isDragging = false;
        userPath = []; 
    }

    function triggerSuccess() {
        completedStars++;
        starCountEl.textContent = completedStars;

        if (completedStars >= 5) {
            isGameOver = true;
            rewardOverlay.classList.add('show');
            document.getElementById('reward-sub').textContent = "你已經完成 5 次挑戰囉！";
            restartBtn.style.display = 'block';
        } else {
            rewardOverlay.classList.add('show');
            setTimeout(function() {
                rewardOverlay.classList.remove('show');
                userPath = [];
            }, 1200);
        }
    }

    restartBtn.addEventListener('click', function() {
        completedStars = 0;
        starCountEl.textContent = completedStars;
        isGameOver = false;
        restartBtn.style.display = 'none';
        userPath = [];
        rewardOverlay.classList.remove('show');
    });

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, logicalWidth, logicalHeight);
        if (bgLoaded) {
            ctx.drawImage(bgImg, 0, 0, logicalWidth, logicalHeight);
        }

        if (umbrellaLoaded) {
            ctx.drawImage(umbrellaImg, 0, 0, logicalWidth, logicalHeight);
        }

        // 3. 繪製加寬 200% 的引導路線
        ctx.beginPath();
        ctx.moveTo(startPoint.x, startPoint.y);
        ctx.lineTo(turnPoint.x, turnPoint.y); 
        ctx.quadraticCurveTo(hookControlPoint.x, hookControlPoint.y, endPoint.x, endPoint.y); 
        ctx.strokeStyle = 'rgba(255, 165, 0, 0.4)';
        ctx.lineWidth = pathWidth; // 寬度設為 80
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();

        // 4. 繪製玩家軌跡
        if (userPath.length > 1) {
            ctx.beginPath();
            ctx.moveTo(userPath[0].x, userPath[0].y);
            for (var i = 1; i < userPath.length; i++) {
                ctx.lineTo(userPath[i].x, userPath[i].y);
            }
            ctx.strokeStyle = '#ff3838';
            ctx.lineWidth = 40; // 相應加粗紅色軌跡
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        // 5. 起點(綠色)與終點(紅色)標示
        var pulse = 30 + Math.sin(Date.now() / 150) * 5; // 加大光環
        ctx.beginPath();
        ctx.arc(startPoint.x, startPoint.y, pulse, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(46, 213, 115, 0.8)';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(endPoint.x, endPoint.y, 40, 0, Math.PI * 2); // 加大終點圓圈
        ctx.fillStyle = '#ff4757';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        ctx.restore();
        
        var reqAnimFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || function(callback) { window.setTimeout(callback, 1000 / 60); };
        reqAnimFrame(loop);
    }

    loop();
</script>

</body>
</html>
