<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雨傘：直鈎 - K2 筆順學習遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f7f9fc;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            touch-action: none; /* 徹底防止 iPad 畫面滑動 */
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 15px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #reward-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #reward-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .reward-card {
            background: #fff;
            padding: 30px 50px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .reward-card h1 {
            color: #ff6b81;
            font-size: 40px;
            margin: 0 0 20px 0;
        }
        #restart-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            background: #ff4757;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 20;
            display: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-board">⭐ <span id="star-count">0</span> / 5</div>
    <canvas id="gameCanvas"></canvas>
    <button id="restart-btn">再玩一次</button>
    
    <div id="reward-overlay">
        <div class="reward-card">
            <h1>✨ 你真努力！</h1>
            <p id="reward-sub" style="font-size: 20px; color: #555; margin: 0;">太棒了，完成一個直鈎囉！</p>
        </div>
    </div>
</div>

<script>
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    var starCountEl = document.getElementById('star-count');
    var rewardOverlay = document.getElementById('reward-overlay');
    var restartBtn = document.getElementById('restart-btn');

    var scale = 1, offsetX = 0, offsetY = 0;
    var logicalWidth = 1414, logicalHeight = 2000;
    var completedStars = 0;
    var isGameOver = false;

    // ==========================================
    // 📍 座標微調區 (對應 1414 x 2000 畫布)
    // 如果發現路線同把遮柄有少少偏差，可以改呢度嘅數字
    // ==========================================
    var startPoint = { x: 707, y: 1000 };       // 1. 起點 (傘布下方正中，向下直落)
    var turnPoint = { x: 707, y: 1550 };        // 2. 轉角位 (直線落到呢度，準備轉彎)
    var hookControlPoint = { x: 707, y: 1600 }; // 3. 彎位控制點 (控制轉角有幾深)
    var endPoint = { x: 550, y: 1450 };         // 4. 終點 (向左上方挑起嘅尖端)
    
    var touchRadius = 80; // 觸控判定範圍 (數字越大越易玩)
    var isDragging = false;
    var userPath = [];

    // 載入圖片 (確保背景及雨傘完全載入)
    var bgImg = new Image();
    var bgLoaded = false;
    bgImg.onload = function() { bgLoaded = true; };
    bgImg.src = '20.png';

    var umbrellaImg = new Image();
    var umbrellaLoaded = false;
    umbrellaImg.onload = function() { umbrellaLoaded = true; };
    umbrellaImg.src = '21.png';

    function resizeCanvas() {
        var container = document.getElementById('game-container');
        var width = container.clientWidth;
        var height = container.clientHeight;
        
        var pixelRatio = window.devicePixelRatio || 1;
        canvas.width = width * pixelRatio;
        canvas.height = height * pixelRatio;
        ctx.scale(pixelRatio, pixelRatio);

        // 使用 Math.min 確保畫面完美置中，背景圖完整顯示不被裁切
        var scaleX = width / logicalWidth;
        var scaleY = height / logicalHeight;
        scale = Math.min(scaleX, scaleY);

        offsetX = (width - logicalWidth * scale) / 2;
        offsetY = (height - logicalHeight * scale) / 2;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function getLogicalPos(e) {
        var rect = canvas.getBoundingClientRect();
        var clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
        var clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left - offsetX) / scale,
            y: (clientY - rect.top - offsetY) / scale
        };
    }

    function getDistance(p1, p2) {
        var dx = p1.x - p2.x;
        var dy = p1.y - p2.y;
        return Math.sqrt(dx * dx + dy * dy);
    }

    // 防干擾事件監聽
    canvas.addEventListener('mousedown', handleStart, false);
    canvas.addEventListener('mousemove', handleMove, false);
    canvas.addEventListener('mouseup', handleEnd, false);
    canvas.addEventListener('mouseleave', handleEnd, false);

    canvas.addEventListener('touchstart', function(e) { e.preventDefault(); handleStart(e); }, {passive: false});
    canvas.addEventListener('touchmove', function(e) { e.preventDefault(); handleMove(e); }, {passive: false});
    canvas.addEventListener('touchend', function(e) { e.preventDefault(); handleEnd(e); }, {passive: false});

    function handleStart(e) {
        if (isGameOver) return;
        var pos = getLogicalPos(e);
        if (getDistance(pos, startPoint) <= touchRadius) {
            isDragging = true;
            userPath = [startPoint];
        }
    }

    function handleMove(e) {
        if (!isDragging || isGameOver) return;
        var pos = getLogicalPos(e);
        userPath.push(pos);

        if (getDistance(pos, endPoint) <= touchRadius) {
            isDragging = false;
            triggerSuccess();
        }
    }

    function handleEnd(e) {
        if (!isDragging) return;
        isDragging = false;
        userPath = []; 
    }

    function triggerSuccess() {
        completedStars++;
        starCountEl.textContent = completedStars;

        if (completedStars >= 5) {
            isGameOver = true;
            rewardOverlay.classList.add('show');
            document.getElementById('reward-sub').textContent = "你已經完成 5 次挑戰囉！";
            restartBtn.style.display = 'block';
        } else {
            rewardOverlay.classList.add('show');
            setTimeout(function() {
                rewardOverlay.classList.remove('show');
                userPath = [];
            }, 1200);
        }
    }

    restartBtn.addEventListener('click', function() {
        completedStars = 0;
        starCountEl.textContent = completedStars;
        isGameOver = false;
        restartBtn.style.display = 'none';
        userPath = [];
        rewardOverlay.classList.remove('show');
    });

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        // 1. 繪製背景 (白色底層 + 20.png)
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, logicalWidth, logicalHeight);
        if (bgLoaded) {
            ctx.drawImage(bgImg, 0, 0, logicalWidth, logicalHeight);
        }

        // 2. 繪製雨傘 (21.png)
        if (umbrellaLoaded) {
            ctx.drawImage(umbrellaImg, 0, 0, logicalWidth, logicalHeight);
        }

        // 3. 繪製中文筆畫「直鈎」半透明橙色引導線
        ctx.beginPath();
        ctx.moveTo(startPoint.x, startPoint.y);
        ctx.lineTo(turnPoint.x, turnPoint.y); // 直落 90%
        ctx.quadraticCurveTo(hookControlPoint.x, hookControlPoint.y, endPoint.x, endPoint.y); // 左上鈎起 10%
        ctx.strokeStyle = 'rgba(255, 165, 0, 0.4)';
        ctx.lineWidth = 40;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();

        // 4. 繪製玩家軌跡 (紅色實線)
        if (userPath.length > 1) {
            ctx.beginPath();
            ctx.moveTo(userPath[0].x, userPath[0].y);
            for (var i = 1; i < userPath.length; i++) {
                ctx.lineTo(userPath[i].x, userPath[i].y);
            }
            ctx.strokeStyle = '#ff3838';
            ctx.lineWidth = 25;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        // 5. 起點(綠色閃爍)與終點(紅色)標示
        var pulse = 20 + Math.sin(Date.now() / 150) * 5;
        ctx.beginPath();
        ctx.arc(startPoint.x, startPoint.y, pulse, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(46, 213, 115, 0.8)';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(endPoint.x, endPoint.y, 25, 0, Math.PI * 2);
        ctx.fillStyle = '#ff4757';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        ctx.restore();
        
        var reqAnimFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || function(callback) { window.setTimeout(callback, 1000 / 60); };
        reqAnimFrame(loop);
    }

    loop();
</script>

</body>
</html>
