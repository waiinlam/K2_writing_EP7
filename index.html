<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>雨傘：鈎 - K2 筆順學習遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f7f9fc;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 15px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #reward-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #reward-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .reward-card {
            background: #fff;
            padding: 30px 50px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .reward-card h1 {
            color: #ff6b81;
            font-size: 40px;
            margin: 0 0 20px 0;
        }
        #restart-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            background: #ff4757;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 20;
            display: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-board">⭐ <span id="star-count">0</span> / 5</div>
    <canvas id="gameCanvas"></canvas>
    <button id="restart-btn">再玩一次</button>
    
    <div id="reward-overlay">
        <div class="reward-card">
            <h1>✨ 你真努力！</h1>
            <p id="reward-sub" style="font-size: 20px; color: #555; margin: 0;">太棒了，完成一個鈎囉！</p>
        </div>
    </div>
</div>

<script>
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    var starCountEl = document.getElementById('star-count');
    var rewardOverlay = document.getElementById('reward-overlay');
    var restartBtn = document.getElementById('restart-btn');

    var scale = 1, offsetX = 0, offsetY = 0;
    var logicalWidth = 1414, logicalHeight = 2000;
    var completedStars = 0;
    var isGameOver = false;

    var isDragging = false;
    var userPath = [];
    var startPoint = { x: 707, y: 1100 };
    var endPoint = { x: 760, y: 1550 };
    var hookControlPoint = { x: 707, y: 1550 };
    var touchRadius = 65;

    // 載入圖片
    var bgImg = new Image();
    bgImg.src = '20.png';
    var bgLoaded = false;
    bgImg.onload = function() { bgLoaded = true; };

    var umbrellaImg = new Image();
    umbrellaImg.src = '21.png';
    var umbrellaLoaded = false;
    umbrellaImg.onload = function() { umbrellaLoaded = true; };

    function resizeCanvas() {
        var container = document.getElementById('game-container');
        var width = container.clientWidth;
        var height = container.clientHeight;
        
        // 為了舊平板相容性，取較安全的數值
        var pixelRatio = window.devicePixelRatio || 1;

        canvas.width = width * pixelRatio;
        canvas.height = height * pixelRatio;
        ctx.scale(pixelRatio, pixelRatio);

        var scaleX = width / logicalWidth;
        var scaleY = height / logicalHeight;
        scale = Math.min(scaleX, scaleY);

        offsetX = (width - logicalWidth * scale) / 2;
        offsetY = (height - logicalHeight * scale) / 2;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function getLogicalPos(e) {
        var rect = canvas.getBoundingClientRect();
        var clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
        var clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left - offsetX) / scale,
            y: (clientY - rect.top - offsetY) / scale
        };
    }

    // 計算兩點距離 (傳統寫法相容舊設備)
    function getDistance(p1, p2) {
        var dx = p1.x - p2.x;
        var dy = p1.y - p2.y;
        return Math.sqrt(dx * dx + dy * dy);
    }

    canvas.addEventListener('mousedown', handleStart, false);
    canvas.addEventListener('mousemove', handleMove, false);
    canvas.addEventListener('mouseup', handleEnd, false);

    canvas.addEventListener('touchstart', function(e) { handleStart(e); }, {passive: false});
    canvas.addEventListener('touchmove', function(e) { e.preventDefault(); handleMove(e); }, {passive: false});
    canvas.addEventListener('touchend', function(e) { handleEnd(e); }, false);

    function handleStart(e) {
        if (isGameOver) return;
        var pos = getLogicalPos(e);
        if (getDistance(pos, startPoint) <= touchRadius) {
            isDragging = true;
            userPath = [startPoint];
        }
    }

    function handleMove(e) {
        if (!isDragging || isGameOver) return;
        var pos = getLogicalPos(e);
        userPath.push(pos);

        if (getDistance(pos, endPoint) <= touchRadius) {
            isDragging = false;
            triggerSuccess();
        }
    }

    function handleEnd() {
        if (!isDragging) return;
        isDragging = false;
        userPath = [];
    }

    function triggerSuccess() {
        completedStars++;
        starCountEl.textContent = completedStars;

        if (completedStars >= 5) {
            isGameOver = true;
            rewardOverlay.classList.add('show');
            document.getElementById('reward-sub').textContent = "你已經完成 5 次挑戰囉！";
            restartBtn.style.display = 'block';
        } else {
            rewardOverlay.classList.add('show');
            setTimeout(function() {
                rewardOverlay.classList.remove('show');
                userPath = [];
            }, 1200);
        }
    }

    restartBtn.addEventListener('click', function() {
        completedStars = 0;
        starCountEl.textContent = completedStars;
        isGameOver = false;
        restartBtn.style.display = 'none';
        userPath = [];
        rewardOverlay.classList.remove('show');
    });

    // 畫面主迴圈
    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        // 背景
        if (bgLoaded) {
            ctx.drawImage(bgImg, 0, 0, logicalWidth, logicalHeight);
        } else {
            ctx.fillStyle = "#e8eff5";
            ctx.fillRect(0, 0, logicalWidth, logicalHeight);
        }

        // 雨傘
        if (umbrellaLoaded) {
            ctx.drawImage(umbrellaImg, 0, 0, logicalWidth, logicalHeight);
        }

        // 提示線
        ctx.beginPath();
        ctx.moveTo(startPoint.x, startPoint.y);
        ctx.quadraticCurveTo(hookControlPoint.x, hookControlPoint.y, endPoint.x, endPoint.y);
        ctx.strokeStyle = 'rgba(255, 165, 0, 0.5)';
        ctx.lineWidth = 35;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();

        // 玩家軌跡
        if (userPath.length > 1) {
            ctx.beginPath();
            ctx.moveTo(userPath[0].x, userPath[0].y);
            for (var i = 1; i < userPath.length; i++) {
                ctx.lineTo(userPath[i].x, userPath[i].y);
            }
            ctx.strokeStyle = '#ff3838';
            ctx.lineWidth = 25;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        // 起點與終點圓圈
        ctx.beginPath();
        ctx.arc(startPoint.x, startPoint.y, 20, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(46, 213, 115, 0.9)';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(endPoint.x, endPoint.y, 25, 0, Math.PI * 2);
        ctx.fillStyle = '#ff4757';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        ctx.restore();
        
        // 舊設備相容的動畫呼叫
        var reqAnimFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || function(callback) { window.setTimeout(callback, 1000 / 60); };
        reqAnimFrame(loop);
    }

    loop();
</script>

</body>
</html>
